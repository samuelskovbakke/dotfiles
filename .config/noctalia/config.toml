[nightlight]
enabled = true
temperature_night = 2500

[plugins]
enabled = [ "nightwatch75/file-search", "imjustdoingmypart/niri-animations" ]

[shell]
avatar_path = "/home/samuel/avatar.png"
clipboard_enabled = false
date_format = "%A, %d-%m-%Y"
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true

    [shell.launcher]
    auto_paste = "ctrl_v"
    pinned = [ "zen-beta", "com.mitchellh.ghostty", "io.missioncenter.MissionCenter" ]

        [shell.launcher.providers.session]
        global = true

    [shell.panel]
    control_center_position = "center"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    annotate = true
    confirm_region = true
    remember_last_region = true
    save_to_file = false

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

[theme]
builtin = "Noctalia"
community_palette = "Catppuccin Mocha Sapphire"
mode = "dark"
source = "community"
wallpaper_scheme = "m3-content"

[wallpaper]
directory = "/home/samuel/Pictures/wallpapers"

    [wallpaper.default]
    path = "/nix/store/qiipyv1s07rp6myhbla2bh5rgg0g61lf-noctalia-5.0.1/share/noctalia/assets/noctalia-wallpaper.png"

    [wallpaper.last]
    path = "/home/samuel/Pictures/wallpapers/wallhaven_g8qzl3.jpg"

    [wallpaper.monitors.DP-1]
    path = "/home/samuel/Pictures/wallpapers/wallhaven_eyw5qw.jpg"

    [wallpaper.monitors.DP-2]
    path = "/home/samuel/Pictures/wallpapers/wallhaven_g8qzl3.jpg"

    [wallpaper.monitors.DP-3]
    path = "/home/samuel/Pictures/wallpapers/wallhaven_2y2wg6.jpg"

[widget.battery]
display_mode = "graphic"

[widget.clock]
format = "{:%H:%M %a,  %b %d}"

    [widget.clock.actions]
    middle = "none"
    right = "settings-open-widget"

[widget.control-center]
glyph = "snowflake"

[widget.media]
hide_when_no_media = true

[widget.tray]
drawer = true
drawer_item_size = 18.0

[widget.weather]
show_condition = false
