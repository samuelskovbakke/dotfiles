[audio]
enable_sounds = true

[bar]
order = [ "full-size" ]

    [bar.full-size]
    background_opacity = 0.69999998435378075
    capsule = true
    center = [ "clock", "workspaces", "weather" ]
    end = [ "tray", "notifications", "network", "volume", "battery", "keyboard_layout", "session" ]
    margin_ends = 0
    padding = 6
    radius_top_left = 0
    radius_top_right = 0
    start = [ "active_window", "media" ]

[calendar]

[control_center]
width = 900

    [control_center.calendar]
    show_week_numbers = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 660.0

[location]
auto_locate = true

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 960.0
    cy = 898.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 160.0
    box_width = 416.0
    cx = 960.0
    cy = 268.0
    output = "eDP-1"
    placement_height = 1080.0
    placement_width = 1920.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        background = false
        background_color = "primary"
        center_text = true
        clock_style = "digital"
        shadow = true

[nightlight]
enabled = true
temperature_night = 2500

[plugins]
enabled = [ "nightwatch75/file-search", "imjustdoingmypart/niri-animations" ]

[shell]
avatar_path = "/home/samuel/avatar.png"
clipboard_enabled = false
polkit_agent = true
screen_time_enabled = true
settings_window_translucent = true

    [shell.launcher]
    auto_paste = "ctrl_v"
    pinned = [ "zen-beta", "com.mitchellh.ghostty", "io.missioncenter.MissionCenter" ]

        [shell.launcher.providers.session]
        global = true

    [shell.panel]
    control_center_position = "center"
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "soft"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.screenshot]
    annotate = true
    remember_last_region = true
    save_to_file = false

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "destructive"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 0.0
    enabled = false
    shortcut = "3"
    variant = "default"

[theme]
community_palette = "Catppuccin Mocha Sapphire"
source = "community"

[wallpaper]
directory = "/home/samuel/Pictures/wallpapers"

    [wallpaper.default]
    path = "/home/samuel/Pictures/wallpapers/shaded_landscape.jpg"

    [wallpaper.last]
    path = "/home/samuel/Pictures/wallpapers/shaded_landscape.jpg"

[widget.battery]
display_mode = "graphic"

[widget.clock]
format = "{:%H:%M %a,  %b %d}"

    [widget.clock.actions]
    middle = "none"
    right = "settings-open-widget"

[widget.media]
hide_when_no_media = true

[widget.tray]
drawer = true
drawer_item_size = 18.0

[widget.weather]
show_condition = false
