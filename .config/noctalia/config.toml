[audio]
enable_sounds = true

[bar]
order = [ "full-size" ]

    [bar.full-size]
    background_opacity = 0.69999998435378075
    capsule = true
    center = [ "clock", "weather", "workspaces" ]
    end = [ "tray", "notifications", "group:g1", "control-center" ]
    margin_ends = 0
    padding = 6
    radius_top_left = 0
    radius_top_right = 0
    start = [ "active_window", "media" ]

        [[bar.full-size.capsule_group]]
        accordion = false
        accordion_direction = "end"
        enabled = true
        fill = "surface_variant"
        id = "g1"
        members = [ "volume", "keyboard_layout" ]
        opacity = 1.0
        padding = 6.0

[calendar]

[control_center]
hidden_tabs = [ "power" ]
width = 900

    [control_center.calendar]
    show_week_numbers = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = false
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = false
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = false
    timeout = 660.0

[location]
auto_locate = true

[lockscreen]
monitors = [ "DP-1" ]

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@DP-2",
    "lockscreen-login-box@DP-1",
    "lockscreen-login-box@DP-3",
    "lockscreen-widget-0000000000000001"
]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@DP-1"]
